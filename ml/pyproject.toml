[project]
name = "cie"
version = "2.0.0"
description = "Count it Easy! – ML pipeline (geometry, scoring, decoding, training, export)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15", "onnxscript"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
